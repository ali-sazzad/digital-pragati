# Publishes static-site/ to GitHub Pages:
# https://ali-sazzad.github.io/digital-pragati/
#
# Only static-site/ goes to Pages. The Next.js site in web/ needs a server
# (enquiry form, database, admin), which GitHub Pages can't run.
name: Deploy static site to Pages

on:
  push:
    branches: [main]
    paths:
      - "static-site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: static-site
      - id: deployment
        uses: actions/deploy-pages@v5
